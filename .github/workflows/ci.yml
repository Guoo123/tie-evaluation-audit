name: artifact-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src scripts tests examples
      - name: Tests
        run: pytest
      - name: Archived evidence and mechanism verification
        run: python scripts/verify_artifact.py --level archive
      - name: Anonymous package check
        run: python scripts/check_anonymity.py
      - name: Package checksum manifest
        run: python scripts/verify_manifest.py
