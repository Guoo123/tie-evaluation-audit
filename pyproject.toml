[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tie-evaluation-audit"
version = "1.0.0"
description = "Anonymous reproducibility artifact for an order-invariance audit of tie-heavy recommender evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Research artifact; see LICENSE.md"}
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
  "pyarrow==18.1.0",
  "duckdb==1.1.3",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "tqdm==4.67.1",
  "orjson==3.10.12",
  "matplotlib==3.9.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
tie-audit-verify = "tie_eval.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
