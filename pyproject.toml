[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tie-evaluation-audit"
version = "1.1.0"
description = "Reproducibility artifact for an order-invariance audit of tie-heavy recommender evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Research artifact; see LICENSE.md"}
dependencies = [
  "numpy>=1.26.4,<3",
  "pandas>=2.2.3,<3",
  "scipy>=1.14.1,<2",
  "scikit-learn>=1.5.2,<2",
  "joblib>=1.4.2,<2",
  "pyarrow>=18.1.0",
  "duckdb>=1.1.3,<2",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.3,<3",
  "tqdm>=4.67.1,<5",
  "orjson>=3.10.12,<4",
  "matplotlib>=3.9.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4,<10", "ruff>=0.8.4,<1"]

[project.scripts]
tie-audit-verify = "tie_eval.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"examples/*.py" = ["E402"]
